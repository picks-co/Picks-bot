<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picks Bot</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">

    <header>

        <div class="logo">
            🚀
        </div>

        <h1>Picks Bot</h1>

        <p>Transformando links em vendas</p>

    </header>

    <main>

        <div class="card">

            <label>🔗 Link da SHEIN</label>
            <input id="link" type="text" placeholder="Cole aqui o link">

            <label>💰 Preço</label>
            <input id="preco" type="text" placeholder="Ex: 79,90">

            <label>🆔 ID do Produto</label>
            <input id="idProduto" type="text" placeholder="Ex: 48291573">

            <button id="gerar">
                🚀 Gerar Postagem
            </button>

        </div>

        <div class="card">

            <h2>Resultado</h2>

            <textarea
                id="resultado"
                readonly
                placeholder="Sua postagem aparecerá aqui..."
            ></textarea>

            <button id="copiar">
                📋 Copiar Mensagem
            </button>

            <button id="whatsapp">
                💬 Abrir WhatsApp
            </button>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
